name: Publish Package to NPM

on:
  push:
    branches:
      - main
    paths:
      - 'icones/**'
      - 'bin/**'
      - 'index.js'
      - 'index.d.ts'
      - 'build-icons.js'
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Build Icons Registry
        run: npm run build:icons

      - name: Publish to NPM
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
